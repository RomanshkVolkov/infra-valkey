[defaults]
# Rutas relativas a la raíz del repo para poder ejecutar desde aquí.
inventory                 = inventory/hosts.yml
roles_path                = roles
collections_path          = ./collections:~/.ansible/collections
# Salida legible. (El callback 'yaml' vive en community.general, que no
# instalamos para mantener mínimas las dependencias; usamos el integrado.)
stdout_callback           = default
# Útil para ver qué tareas se saltan / cambian al depurar idempotencia.
display_skipped_hosts     = true
display_ok_hosts          = true
# Evita crear archivos .retry sueltos en el repo.
retry_files_enabled       = false
# Mostramos cuánto tarda cada tarea (ayuda a detectar los retry loops largos).
callbacks_enabled         = ansible.posix.profile_tasks
# Interpreta strings vacíos / "yes-no" de forma estricta para evitar sorpresas.
interpreter_python        = auto_silent
# El nodo es de un único operador: forks bajos bastan.
forks                     = 5

[ssh_connection]
# Acelera reconexiones SSH reutilizando el socket.
pipelining   = true
ssh_args     = -o ControlMaster=auto -o ControlPersist=60s -o PreferredAuthentications=publickey

[inventory]
# Avisa si el inventario no se parsea, en vez de fallar en silencio.
enable_plugins = yaml, ini
unparsed_is_failed = true
