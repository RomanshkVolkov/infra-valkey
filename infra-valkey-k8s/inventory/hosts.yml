---
# Inventario: un único nodo k3s bajo el grupo `k8s_nodes`.
#
# NO edites este archivo para un despliegue normal: todos los valores de
# conexión (IP, usuario, clave) se leen de group_vars/all/config.yml, que es
# el ÚNICO archivo que tienes que tocar. Aquí solo declaramos el host y dejamos
# que las variables se resuelvan desde esa config.
#
# Modelo de ejecución:
#   - Ansible se conecta por SSH al nodo para 00-prereqs (instalar helm) y
#     05-fetch-kubeconfig (traer el kubeconfig al laptop).
#   - El resto (módulos kubernetes.core.*) lo hace el CONTROLADOR hablando con
#     la API de k3s usando el kubeconfig local (variable `kubeconfig`).

all:
  children:
    k8s_nodes:
      hosts:
        valkey-node:
          # Conexión SSH resuelta desde group_vars/all/config.yml.
          #
          # Dos formas (la que rellenes en config.yml):
          #   A) node_ssh_alias: un Host de tu ~/.ssh/config (recomendado si ya
          #      tienes uno que funciona). Trae HostName/Port/User/clave del propio
          #      ssh config + tu agente. No necesitas tocar nada más.
          #   B) node_ip + node_ssh_port + node_user: conexión explícita.
          #
          # La autenticación usa tu ssh-agent / ~/.ssh/config (no fijamos un
          # archivo de clave). Si necesitas una clave concreta, añádela a tu
          # ~/.ssh/config para ese host.
          ansible_host: "{{ node_ssh_alias | default(node_ip, true) }}"
          ansible_port: "{{ node_ssh_port | default(22, true) }}"
          ansible_user: "{{ node_user | default('root', true) }}"
      vars:
        # Python del controlador (el del .venv) donde están `kubernetes`/`pyyaml`.
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
