---
# =====================================================================
# 05-fetch-kubeconfig.yml — Trae el kubeconfig de k3s al CONTROLADOR.
#
# Copia /etc/rancher/k3s/k3s.yaml del nodo a la ruta local `kubeconfig`
# (definida en config.yml) y reescribe el campo `server:` para que apunte a
# `node_ip` en vez de a 127.0.0.1. Así el controlador puede hablar con la API.
#
# Idempotente: si el kubeconfig local YA existe, no lo toca (no sobrescribe
# ediciones manuales). Borra el archivo local si quieres re-traerlo.
# =====================================================================
- name: "Obtener kubeconfig de k3s en el controlador"
  hosts: k8s_nodes
  gather_facts: false
  become: true
  run_once: true
  tasks:
    - name: "¿Existe ya el kubeconfig local?"
      ansible.builtin.stat:
        path: "{{ kubeconfig | expanduser }}"
      delegate_to: localhost
      become: false
      register: kc_local

    - name: "Leer el kubeconfig del nodo"
      ansible.builtin.slurp:
        # k3s por defecto; configurable con node_kubeconfig_src para otras distros.
        src: "{{ node_kubeconfig_src | default('/etc/rancher/k3s/k3s.yaml') }}"
      register: kc_remote
      when: not kc_local.stat.exists

    - name: "Crear el directorio del kubeconfig si falta"
      ansible.builtin.file:
        path: "{{ kubeconfig | expanduser | dirname }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false
      when: not kc_local.stat.exists

    - name: "Escribir kubeconfig local con server -> node_ip"
      ansible.builtin.copy:
        content: >-
          {{ kc_remote.content | b64decode
             | regex_replace('https://127.0.0.1:6443', 'https://' ~ node_ip ~ ':6443') }}
        dest: "{{ kubeconfig | expanduser }}"
        mode: "0600"
      delegate_to: localhost
      become: false
      when: not kc_local.stat.exists

    - name: "Aviso: kubeconfig ya presente"
      ansible.builtin.debug:
        msg: >-
          kubeconfig local ya existe en {{ kubeconfig }} (no se sobrescribe).
          Bórralo si quieres re-traerlo del nodo.
      # delegate a localhost: si el kubeconfig ya existe, NO se conecta al nodo.
      delegate_to: localhost
      become: false
      when: kc_local.stat.exists
