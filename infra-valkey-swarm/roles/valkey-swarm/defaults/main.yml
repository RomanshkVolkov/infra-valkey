---
# Defaults del role valkey-swarm. Sobreescribibles desde group_vars.
# bitnami/valkey:* dan 404 desde 2025; usa bitnamilegacy/* (ver README).
valkey_image: "bitnamilegacy/valkey:8.1.3-debian-12-r1"
valkey_stack_name: "cache"
valkey_service_name: "valkey"
valkey_network_name: "valkey_net"
valkey_port: 6379
valkey_secret_name: "valkey_password"

# Memoria: la fuente única es valkey_maxmemory_mb (config.yml); valkey_maxmemory
# y valkey_mem_limit se DERIVAN en inventory/group_vars/all/vars.yml. Fallback
# por si se usara el role suelto:
valkey_maxmemory_mb: 512
valkey_maxmemory_policy: "allkeys-lru"

valkey_cpu_limit: "0.5"
valkey_cpu_reservation: "0.1"

valkey_wait_retries: 30
valkey_wait_delay: 5

valkey_stack_file_remote: "/etc/valkey-swarm/{{ valkey_stack_name }}-stack.yml"
