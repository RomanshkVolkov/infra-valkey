---
# Inventario: el VPS de Swarm. La conexión se resuelve desde
# inventory/group_vars/all/config.yml (NO edites este archivo para un
# despliegue normal).
#
# Los módulos community.docker.* corren EN el VPS por SSH (cada VPS gestiona
# su Swarm local). Por eso ansible_python_interpreter apunta al Python del
# host, donde 00-prereqs instala el SDK python3-docker.
#
# ¿Varios VPS? Duplica el bloque host con sus propios valores (cada Valkey es
# independiente). La forma simple, un solo VPS, vive en config.yml.
all:
  children:
    swarm_nodes:
      hosts:
        valkey-vps:
          ansible_host: "{{ node_ssh_alias | default(node_ip, true) }}"
          ansible_port: "{{ node_ssh_port | default(22, true) }}"
          ansible_user: "{{ node_user | default('root', true) }}"
      vars:
        ansible_python_interpreter: "/usr/bin/python3"
